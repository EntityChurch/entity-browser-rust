<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Alpine Environment — browser proof</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e12;color:#c8d2dc;
            font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  body{display:flex;flex-direction:column}
  header{padding:6px 10px;background:#151a21;border-bottom:1px solid #222b35;flex:0 0 auto}
  #verdict{font-weight:700}
  .ok{color:#7ee787}.bad{color:#ff7b72}.wait{color:#d29922}
  #env{margin:0;padding:4px 10px;color:#7d8590;font-size:11px;flex:0 0 auto;
       white-space:pre-wrap}
  #serial{flex:1 1 auto;min-height:0;overflow:auto;margin:0;padding:8px 10px;
          background:#000;color:#b9f6b9;white-space:pre-wrap;word-break:break-all}
  #screen_container{display:none}
</style>
<body>
<header>
  <div id="verdict" class="wait">booting…</div>
</header>
<pre id="env">measuring…</pre>
<pre id="serial"></pre>
<div id="screen_container"><div style="white-space:pre;font:14px monospace"></div><canvas></canvas></div>

<!-- libv86.js, NOT v86_all.js -- the "all" bundle carries copy.sh's demo UI and
     throws on a page that lacks its DOM, taking the emulator with it. -->
<script src="build/libv86.js"></script>
<script>
// THE BROWSER PROOF. The guest is already measured in node (8.0s, 119 distinct
// blobs, 8.5 MiB). What node CANNOT tell us is the thing that decides whether
// this is shippable: in a browser those 119 blobs are 119 HTTP REQUESTS, and
// request overhead, connection limits and the browser cache all land here and
// nowhere else. So this page measures the transfer, not just the boot.
const $ = (id) => document.getElementById(id);
const t0 = performance.now();

const env = {
  // v86 is expected to need NO cross-origin isolation (M1). Recording both,
  // because SAB presence is not a proxy for isolation -- Firefox reports
  // crossOriginIsolated=false and still exposes the constructor.
  crossOriginIsolated: (typeof crossOriginIsolated !== 'undefined') ? crossOriginIsolated : 'undefined',
  SharedArrayBuffer_present: (typeof SharedArrayBuffer !== 'undefined'),
  V86: (typeof V86 !== 'undefined'),
  ua: navigator.userAgent.slice(0, 90),
};

window.__m1 = { env, serial: '', booted: false, error: null, t0,
                bootMs: null, promptMs: null, probeOk: false, net: null };

// --- the transfer measurement ----------------------------------------------
// Resource Timing sees every fetch v86 makes. Split blobs from the big
// fixed-cost artifacts, because they are different kinds of cost: the blobs
// fault lazily and scale with what the guest touches, the kernel and initramfs
// are paid in full by every visitor.
function netStats() {
  const rs = performance.getEntriesByType('resource');
  // TRANSFERRED and CONSUMED are different facts and conflating them is a bug I
  // shipped in the first cut of this page: a cache hit reports transferSize === 0,
  // so `transferSize || encodedBodySize` silently bills every cache hit at full
  // size and turns a well-behaved boot into a fake 5x blow-up. Report both.
  //   transferred = what left the network  (the number a visitor pays)
  //   consumed    = what the emulator read (transferred + cache hits)
  const pick = (pred) => {
    const m = rs.filter(pred);
    return { n: m.length,
             bytes: m.reduce((a, r) => a + (r.transferSize || 0), 0),
             consumed: m.reduce((a, r) => a + (r.encodedBodySize || 0), 0),
             ms: Math.round(m.reduce((a, r) => a + r.duration, 0)) };
  };
  const blobs = pick(r => r.name.includes('/blobs/'));
  // DISTINCT vs REPEAT is the diagnostic that matters: "we fetch more files"
  // and "we fetch the same files over and over" are different defects with
  // different fixes, and the byte total cannot tell them apart.
  const blobNames = rs.filter(r => r.name.includes('/blobs/')).map(r => r.name);
  const uniq = new Set(blobNames);
  blobs.distinct = uniq.size;
  blobs.repeats = blobNames.length - uniq.size;
  const counts = {};
  for (const n of blobNames) counts[n] = (counts[n] || 0) + 1;
  blobs.worst = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5)
                  .map(([n,c]) => c + 'x ' + n.slice(-12));
  blobs.cacheHits = rs.filter(r => r.name.includes('/blobs/') &&
                   (r.transferSize === 0 && r.decodedBodySize > 0)).length;
  return {
    blobs,
    kernel:    pick(r => /vmlinuz|initramfs/.test(r.name)),
    engine:    pick(r => /v86\.wasm|libv86\.js/.test(r.name)),
    index:     pick(r => /fs\.json/.test(r.name)),
    total_requests: rs.length,
  };
}

const strip = (s) => s.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '');
let sentProbe = false;

try {
  const emulator = new V86({
    wasm_path: "build/v86.wasm",
    memory_size: 256 * 1024 * 1024,
    vga_memory_size: 2 * 1024 * 1024,
    screen_container: $("screen_container"),
    bios: { url: "bios/seabios.bin" },
    vga_bios: { url: "bios/vgabios.bin" },
    bzimage: { url: "guest/vmlinuz" },
    initrd: { url: "guest/initramfs" },
    // root=host9p -- v86's 9p mount tag, read out of the engine's own
    // configspace_tagname, not guessed.
    cmdline: "rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose " +
             "console=ttyS0 console=tty0 init=/sbin/init",
    filesystem: { basefs: { url: "guest/fs.json" }, baseurl: "guest/blobs/" },
    autostart: true,
    disable_speaker: true,
  });
  window.__m1.emulator = emulator;

  const serialEl = $("serial");
  emulator.add_listener("serial0-output-byte", (byte) => {
    const m = window.__m1;
    m.serial += String.fromCharCode(byte);
    serialEl.textContent = m.serial.slice(-6000);
    serialEl.scrollTop = serialEl.scrollHeight;

    const plain = strip(m.serial);

    if (!m.booted && /Mounting root: ok|Alpine Init/.test(plain)) {
      m.booted = true;
      m.bootMs = Math.round(performance.now() - t0);
    }
    // A prompt is not proof: a prompt that cannot answer is a hung guest that
    // happens to have printed something. Ask it a question only a working
    // userland can answer.
    if (!sentProbe && /[$#] $/.test(plain.slice(-16))) {
      sentProbe = true;
      m.promptMs = Math.round(performance.now() - t0);
      setTimeout(() => emulator.serial0_send(
        "echo PROBE-$(uname -sm)-$(bash -c 'echo ${BASH_VERSION%%.*}')-OK\n"), 400);
    }
    if (!m.probeOk && /PROBE-Linux i\d86-\d+-OK/.test(plain)) {
      m.probeOk = true;
      m.net = netStats();
      $("verdict").className = 'ok';
      $("verdict").textContent =
        `GUEST IS UP — prompt ${(m.promptMs/1000).toFixed(1)}s, ` +
        `${m.net.blobs.n} blob requests, ` +
        `${(m.net.blobs.bytes/1048576).toFixed(1)} MiB lazy + ` +
        `${(m.net.kernel.bytes/1048576).toFixed(1)} MiB fixed`;
      $("env").textContent = JSON.stringify({ env, net: m.net }, null, 1);
    }
  });
} catch (e) {
  window.__m1.error = String(e);
  $("verdict").className = 'bad';
  $("verdict").textContent = 'FAILED: ' + window.__m1.error;
}

// keep the network panel live even before the probe answers
setInterval(() => {
  const m = window.__m1;
  if (!m.probeOk) {
    m.net = netStats();
    $("env").textContent = JSON.stringify({ env, net: m.net }, null, 1);
    if (m.booted) { $("verdict").textContent =
      `root mounted at ${(m.bootMs/1000).toFixed(1)}s — waiting for a prompt…`; }
  }
}, 1000);
</script>
