<!doctype html>
<meta charset="utf-8">
<title>M1 — does v86 boot WITHOUT cross-origin isolation?</title>
<body style="font-family:monospace">
<h3>M1: v86 on a NON-isolated origin</h3>
<div id="verdict">starting…</div>
<pre id="env"></pre>
<h4>serial0</h4>
<pre id="serial" style="background:#111;color:#0f0;padding:8px;height:320px;overflow:auto"></pre>
<div id="screen_container" style="display:none">
  <div style="white-space:pre;font:14px monospace"></div>
  <canvas></canvas>
</div>
<!-- libv86.js, NOT v86_all.js: the "all" bundle carries copy.sh's own demo UI, which
     throws on a page that lacks its DOM ("can't access property onclick") and takes
     the emulator down with it. Library build only. -->
<script src="build/libv86.js"></script>
<script>
// The whole point of this page: it is served with NO COOP/COEP, so the origin is
// not cross-origin isolated and SharedArrayBuffer should be absent. If v86 boots
// anyway, the small-engine tier does not force the isolation decision. If it
// refuses, then nothing in the engine space avoids rung 0 and the posture
// decision is forced for every path.
//
// ⚠ SAB *presence* is not a proxy for isolation — measured here: Firefox reports
// crossOriginIsolated=false and still exposes the SharedArrayBuffer constructor.
// crossOriginIsolated is the authoritative predicate; what SAB can actually DO is a
// separate fact, so both are recorded.
const env = {
  crossOriginIsolated: (typeof crossOriginIsolated !== 'undefined') ? crossOriginIsolated : 'undefined',
  SharedArrayBuffer_present: (typeof SharedArrayBuffer !== 'undefined'),
  SharedArrayBuffer_constructs: (function () {
    try { new SharedArrayBuffer(8); return true; } catch (e) { return String(e).slice(0, 120); }
  })(),
  V86: (typeof V86 !== 'undefined'),
  V86Starter: (typeof V86Starter !== 'undefined'),
};
document.getElementById('env').textContent = JSON.stringify(env, null, 2);
window.__m1 = { env, serial: '', booted: false, error: null, t0: performance.now() };

const Ctor = (typeof V86 !== 'undefined') ? V86
           : (typeof V86Starter !== 'undefined') ? V86Starter : null;
if (!Ctor) {
  window.__m1.error = 'no V86 constructor in the bundle';
  document.getElementById('verdict').textContent = 'FAILED: ' + window.__m1.error;
} else {
  try {
    const emulator = new Ctor({
      wasm_path: "build/v86.wasm",
      memory_size: 64 * 1024 * 1024,
      vga_memory_size: 2 * 1024 * 1024,
      screen_container: document.getElementById("screen_container"),
      bios: { url: "bios/seabios.bin" },
      vga_bios: { url: "bios/vgabios.bin" },
      cdrom: { url: "images/linux4.iso" },
      autostart: true,
    });
    window.__m1.emulator = emulator;
    emulator.add_listener("serial0-output-byte", function (byte) {
      const ch = String.fromCharCode(byte);
      window.__m1.serial += ch;
      const el = document.getElementById('serial');
      el.textContent = window.__m1.serial.slice(-6000);
      el.scrollTop = el.scrollHeight;
      // A login prompt or a shell prompt is the guest having actually reached userland.
      if (/login:|~%|\/ #|localhost/.test(window.__m1.serial) && !window.__m1.booted) {
        window.__m1.booted = true;
        window.__m1.bootMs = Math.round(performance.now() - window.__m1.t0);
        document.getElementById('verdict').textContent =
          'BOOTED in ' + window.__m1.bootMs + 'ms with crossOriginIsolated=' +
          env.crossOriginIsolated + ' SAB=' + env.SharedArrayBuffer;
      }
    });
    emulator.add_listener("emulator-started", function () {
      document.getElementById('verdict').textContent = 'emulator started, waiting for serial…';
    });
  } catch (e) {
    window.__m1.error = String(e);
    document.getElementById('verdict').textContent = 'THREW: ' + window.__m1.error;
  }
}
window.addEventListener('error', e => {
  window.__m1.error = (window.__m1.error || '') + ' | onerror: ' + e.message;
});
window.addEventListener('unhandledrejection', e => {
  window.__m1.error = (window.__m1.error || '') + ' | rejection: ' + String(e.reason);
});
</script>
</body>
