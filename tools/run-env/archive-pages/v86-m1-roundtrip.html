<!doctype html>
<meta charset="utf-8">
<title>M3 — the file boundary, both directions, on a non-isolated origin</title>
<body style="font-family:monospace">
<h3>M3: page → guest → page</h3>
<div id="verdict">starting…</div>
<pre id="steps"></pre>
<h4>serial0</h4>
<pre id="serial" style="background:#111;color:#0f0;padding:8px;height:300px;overflow:auto"></pre>
<div id="screen_container" style="display:none"><div style="white-space:pre;font:14px monospace"></div><canvas></canvas></div>
<script src="build/libv86.js"></script>
<script>
// The claim under test is the one our whole value-add rests on and the one trynix
// CANNOT do: a file the page puts in is visible to the guest, and a file the guest
// writes is readable back by the page.
//
// On trynix this is where it stops — its share is QEMU's 9p *local* backend over the
// emscripten FS, and the guest gets EPERM on create (measured: touch and mkdir refused,
// writes to an already-existing file fine). v86's 9p server is JavaScript in the page,
// so creation is ours on both sides. That difference is the finding, not the demo.
const S = { log: [], serial: '', phase: 'init' };
window.__m3 = S;
function step(s) { S.log.push(`+${Math.round(performance.now())}ms ${s}`);
  document.getElementById('steps').textContent = S.log.join('\n'); }

const emulator = new V86({
  wasm_path: "build/v86.wasm",
  memory_size: 64 * 1024 * 1024,
  vga_memory_size: 2 * 1024 * 1024,
  screen_container: document.getElementById("screen_container"),
  bios: { url: "bios/seabios.bin" },
  vga_bios: { url: "bios/vgabios.bin" },
  cdrom: { url: "images/linux4.iso" },
  filesystem: {},           // <- the JS 9p server. The guest mounts it at /mnt.
  autostart: true,
});
window.__m3.emulator = emulator;

emulator.add_listener("serial0-output-byte", function (b) {
  S.serial += String.fromCharCode(b);
  const el = document.getElementById('serial');
  el.textContent = S.serial.slice(-6000); el.scrollTop = el.scrollHeight;
  if (S.phase === 'init' && /~%/.test(S.serial)) { S.phase = 'prompt'; step('guest at prompt'); run(); }
});

function send(cmd) { step('send: ' + cmd); emulator.serial0_send(cmd + '\n'); }

async function run() {
  S.phase = 'running';
  // 1. page -> guest. create_file is the page writing into the 9p tree.
  const payload = "ENTITY-INJECTED-PAYLOAD-v1\n";
  await emulator.create_file("in.txt", new TextEncoder().encode(payload));
  step('page created /mnt/in.txt (' + payload.length + ' bytes)');

  send("cat /mnt/in.txt");
  await sleep(1500);
  S.sawInjected = S.serial.includes("ENTITY-INJECTED-PAYLOAD-v1");
  step('guest saw the injected file: ' + S.sawInjected);

  // 2. guest -> page. The direction trynix refuses with EPERM.
  send("echo GUEST-PRODUCED-THIS-$(uname -m) > /mnt/out.txt");
  await sleep(1500);
  send("ls -la /mnt");
  await sleep(1500);

  try {
    const back = await emulator.read_file("out.txt");
    S.extracted = new TextDecoder().decode(back);
    S.sawExtracted = S.extracted.includes("GUEST-PRODUCED-THIS");
    step('page read /mnt/out.txt back: ' + JSON.stringify(S.extracted));
  } catch (e) {
    S.extracted = null; S.sawExtracted = false;
    step('page could NOT read out.txt back: ' + String(e).slice(0, 200));
  }

  S.phase = 'done';
  document.getElementById('verdict').textContent =
    'injected=' + S.sawInjected + '  extracted=' + S.sawExtracted +
    '  (crossOriginIsolated=' + crossOriginIsolated + ')';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
window.addEventListener('error', e => step('ERROR ' + e.message));
window.addEventListener('unhandledrejection', e => step('REJECT ' + String(e.reason)));
</script>
</body>
