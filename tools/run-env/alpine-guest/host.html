<!doctype html>
<meta charset="utf-8">
<title>host harness — the file round trip</title>
<!--
  THE ONE HOST HARNESS. Not a page anyone opens: it is the other side of the
  contract, driven by a probe. `index.html` is THE app page; this is THE host.
  Two artifacts, two roles -- adding a third of either is the mistake that cost
  this arc two days.

    ?app=index.html            which bundle to embed
    ?sandbox=opaque|same       opaque = allow-scripts (our third-party tier,
                               and an opaque origin); same adds allow-same-origin
    ?latesize=0                size the frame up front instead (the easy case)

  ⚠ LATE SIZING IS THE DEFAULT, and it is the only reason the paint assertion
  means anything. The reported bug is "in the iframe it waits until boot is
  complete and then updates the terminal" -- a host that sizes its frame AFTER
  load, so term.open() runs against a 0x0 box. A harness that sets a height in
  its own stylesheet never reproduces that, and then asserts painting works in
  the one configuration where it was never going to fail.

  It runs ONE scripted scenario and reports to window.__host.r. Nothing is
  rendered for a person -- diagnostics belong to the probe.

  THE SCENARIO IS THE ROUND TRIP, and the middle step is the point: the guest has
  to READ what the page wrote and WRITE what the page reads back. A put followed
  by a get proves v86's fs9p remembered a blob; it does not prove the bytes ever
  entered the guest's namespace.
-->
<body style="margin:0;font:13px monospace;background:#111;color:#ddd">
<div id="log" style="padding:6px;white-space:pre"></div>
<iframe id="f" style="width:100%;height:0;border:0;display:block"></iframe>
<script>
const q = new URLSearchParams(location.search);
const APP = q.get('app') || 'index.html';
const SANDBOX = (q.get('sandbox') === 'same')
  ? 'allow-scripts allow-same-origin' : 'allow-scripts';
const LATESIZE = q.get('latesize') !== '0';

const R = window.__host = { r: {}, done: false, sandbox: SANDBOX, app: APP, log: [] };
const say = s => { R.log.push(s); document.getElementById('log').textContent = R.log.join('\n'); };

// ── the two payloads ─────────────────────────────────────────────────────────
// 33 bytes, because that is the length the trailing-NUL bug was measured on: a
// Uint8Array that is a VIEW into a larger buffer arrives as the view PLUS
// whatever else is in there. Data-dependent and silent, so it needs a fixture
// with an awkward length rather than a round one.
const TEXT_IN = new TextEncoder().encode('alpine round trip probe: abcdefg\n');
// every byte value including NUL and 0xFF. A VM moves artifacts, not strings,
// and a path that is clean for ASCII can still be lossy for a tarball.
const BIN_IN = new Uint8Array(256).map((_, i) => i);

const upper = new Uint8Array(TEXT_IN.length);
for (let i = 0; i < TEXT_IN.length; i++) {
  const c = TEXT_IN[i];
  upper[i] = (c >= 97 && c <= 122) ? c - 32 : c;   // what `tr a-z A-Z` must produce
}

const frame = document.getElementById('f');
const send = (t, x) => frame.contentWindow.postMessage(
  Object.assign({ source: 'entity-host', type: t }, x || {}), '*');

const waiters = [];
const await_ = (type, ms) => new Promise((res, rej) => {
  const w = { type, res };
  waiters.push(w);
  setTimeout(() => {
    const i = waiters.indexOf(w);
    if (i >= 0) { waiters.splice(i, 1); rej(new Error('timeout waiting for ' + type)); }
  }, ms || 20000);
});

addEventListener('message', e => {
  const m = e.data;
  if (!m || m.source !== 'entity-app') return;
  if (m.type === 'ready-for-init') { send('init', { state: null }); return; }
  if (m.type === 'error') say('APP ERROR: ' + m.message);
  for (let i = waiters.length - 1; i >= 0; i--) {
    if (waiters[i].type === m.type) { waiters[i].res(m); waiters.splice(i, 1); }
  }
});

const cmp = (a, b) => {
  if (a.length !== b.length) return { equal: false, why: `length ${a.length} != ${b.length}` };
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return { equal: false, why: `byte ${i}: ${a[i]} != ${b[i]}` };
  }
  return { equal: true };
};

async function get(name) {
  const p = await_('x-file', 25000);
  send('x-get-file', { name });
  const m = await p;
  return { name: m.name, declared: m.length, bytes: new Uint8Array(m.data) };
}

(async () => {
  const t0 = performance.now();
  frame.setAttribute('sandbox', SANDBOX);
  // Grow the frame only AFTER its document has loaded -- i.e. after term.open()
  // has already run against a 0x0 box. A `load` handler is the earliest honest
  // moment a real host would know it had something to size.
  frame.addEventListener('load', () => {
    R.r.sized_at_ms = Math.round(performance.now() - t0);
    setTimeout(() => { frame.style.height = '70vh'; }, LATESIZE ? 600 : 0);
  });
  if (!LATESIZE) frame.style.height = '70vh';
  frame.src = APP;
  try {
    // 1 -- the guest reaches a prompt. Everything below needs a shell.
    await await_('ready', 120000);
    R.r.ready_ms = Math.round(performance.now() - t0);
    say('ready in ' + R.r.ready_ms + 'ms');

    // 2 -- page -> v86's 9p tree
    const put = await (async () => { const p = await_('x-files-put'); send('x-put-files', { entries: [
      { name: 'mnt/text-in.txt', bytes: TEXT_IN },
      { name: 'mnt/bin-in.dat',  bytes: BIN_IN },
    ] }); return p; })();
    R.r.put = put.put;
    say('put: ' + JSON.stringify(put.put));

    // 3 -- does the GUEST see them? `ls` is run by the guest's own shell, so a
    //      name here is the file existing in the guest's namespace rather than in
    //      an engine internal.
    const ls1 = await (async () => { const p = await_('x-files-list', 15000); send('x-list-files'); return p; })();
    R.r.listing_after_put = ls1.names;
    R.r.could_not_look = !!ls1.couldNotLook;
    say('ls /mnt -> ' + JSON.stringify(ls1.names));

    // 4 -- THE MIDDLE STEP. The guest reads both files and writes both outputs.
    //      `sync` is not decoration: the root is mounted cache=loose, so without
    //      it a guest write can still be in the guest's page cache when the page
    //      reads, and the failure looks like a lost file rather than a flush.
    const run = await (async () => { const p = await_('x-run-done', 40000); send('x-run', {
      cmd: 'tr a-z A-Z < /mnt/text-in.txt > /mnt/text-out.txt && ' +
           'cp /mnt/bin-in.dat /mnt/bin-out.dat && sync && ' +
           'wc -c < /mnt/text-out.txt && wc -c < /mnt/bin-out.dat',
    }); return p; })();
    R.r.guest_out = run.out;
    R.r.guest_timed_out = !!run.timedOut;
    say('guest: ' + JSON.stringify(run.out));

    // 5 -- v86's 9p tree -> page
    const textOut = await get('mnt/text-out.txt');
    const binOut = await get('mnt/bin-out.dat');
    R.r.text = { declared: textOut.declared, got: textOut.bytes.length,
                 expected: upper.length, ...cmp(textOut.bytes, upper) };
    R.r.bin = { declared: binOut.declared, got: binOut.bytes.length,
                expected: BIN_IN.length, ...cmp(binOut.bytes, BIN_IN) };
    say('text: ' + JSON.stringify(R.r.text));
    say('bin:  ' + JSON.stringify(R.r.bin));

    // 6 -- and the iframe half of step 2, for free: did xterm actually paint
    //      inside a frame the host sized after load? The app reports its own row
    //      count, because the host cannot read into an opaque-origin document.
    const st = await (async () => { const p = await_('state', 10000); send('request-state'); return p; })();
    R.r.app_state = st.state;

    // 7 -- THE GUEST'S OWN VERBS. `send` and `receive` are commands a PERSON types;
    //      the page learns of them from a private OSC the guest prints, never by
    //      typing at the shell. So this drives them the way a person would -- as
    //      a command at the prompt -- and checks the bytes at the other end.
    //  7a host -> guest: an x-file lands in the home directory under its BASE name.
    const PUSHED = new TextEncoder().encode('pushed by the host\n');
    send('x-file', { name: 'some/dir/pushed.txt', media_type: 'text/plain', data: PUSHED });
    await new Promise(r => setTimeout(r, 2500));   // the guest agent moves it into /root
    const cat = await (async () => { const p = await_('x-run-done', 20000);
      send('x-run', { cmd: 'cat /root/pushed.txt' }); return p; })();
    R.r.pushed_seen = cat.out;
    say('guest cat /root/pushed.txt: ' + JSON.stringify(cat.out));
    //  7b guest -> host: `send` hands the host a file the guest just wrote.
    const sent = await_('x-file', 20000);
    send('x-run', { cmd: "printf 'made in the guest\\n' > /root/made.txt && send /root/made.txt" });
    const got = await sent;
    const MADE = new TextEncoder().encode('made in the guest\n');
    R.r.guest_sent = { name: got.name, media_type: got.media_type,
                       ...cmp(new Uint8Array(got.data), MADE), got: new Uint8Array(got.data).length };
    say('guest sent: ' + JSON.stringify(R.r.guest_sent));
  } catch (e) {
    R.r.error = String(e);
    say('FAILED: ' + R.r.error);
  }
  R.done = true;
})();
</script>
</body>
