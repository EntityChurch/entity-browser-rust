<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Alpine Environment</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  /* THE ONE PAGE. Everything before this was a throwaway rig -- see ARCHIVE.md.
     Terminal IS the page: a thin status line, the terminal, the key bar. No
     diagnostics panel; the numbers live in window.__m1 where a probe reads them
     and a person does not have to. */

  /* Flex column, NOT `height: calc(100% - 76px)` on the terminal. The status bar
     wraps to two lines on a narrow screen and a hardcoded subtraction then pushes
     the key bar off the bottom -- measured: the keys were sliced in half at 400px
     wide, i.e. exactly where they are the only way to type. */
  html,body { margin:0; height:100%; background:#1a1a1a; color:#ddd;
              font:13px system-ui,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #bar, #keys { flex:0 0 auto; }
  #term { flex:1 1 auto; min-height:0; }   /* min-height:0 or flex refuses to shrink */
  #bar { padding:5px 9px; background:#252525; border-bottom:1px solid #333;
         display:flex; gap:9px; align-items:center; font-size:12px;
         white-space:nowrap; overflow:hidden; }
  #bar b { font-weight:600; flex:0 0 auto; }
  #status { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
  .dim { color:#888; } .ok { color:#7ee787; } .bad { color:#ff7b72; }
  /* The key bar exists because a phone has no Esc, Tab, Ctrl or arrows, and a
     terminal without them is a read-only screen. trynix ships one for the reason. */
  #keys { display:flex; gap:5px; padding:5px 6px; background:#202020;
          border-top:1px solid #333; overflow-x:auto; }
  #keys button { font:12px/1 monospace; padding:8px 9px; background:#333; color:#ddd;
                 border:1px solid #444; border-radius:3px; min-width:34px;
                 flex:0 0 auto; }
  #keys button.on { background:#0a63c2; border-color:#0a63c2; }
  #screen_container { display:none; }
  /* Power: the machine lives in this page, so this is where it is turned off and on. */
  #power { flex:0 0 auto; font:14px/1 system-ui,sans-serif; padding:3px 8px; background:#333;
           color:#ddd; border:1px solid #444; border-radius:3px; }
  #power.off { background:#7a2a24; border-color:#9a3a32; }
  #powermenu { position:fixed; top:34px; right:6px; z-index:10; background:#2a2a2a;
               border:1px solid #444; border-radius:4px; padding:4px; min-width:230px;
               max-width:calc(100vw - 12px); box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #powermenu button { display:block; width:100%; text-align:left; font:13px system-ui,sans-serif;
                      padding:9px 10px; background:none; color:#ddd; border:0; border-radius:3px; }
  #powermenu button:hover, #powermenu button:focus { background:#3a3a3a; }
  #powermenu .note { padding:6px 10px 4px; font-size:11px; color:#888; white-space:normal; }
</style>
<body>
<div id="bar">
  <b>Alpine</b>
  <span id="status" class="dim">starting…</span>
  <button id="power" title="Restart or turn off the machine" aria-haspopup="true" aria-expanded="false">⏻</button>
</div>
<div id="powermenu" hidden>
  <button data-power="restart">Restart</button>
  <button data-power="cold">Restart and show the boot</button>
  <button data-power="off">Turn off</button>
  <button data-power="start" hidden>Start</button>
  <button data-power="start-cold" hidden>Start and show the boot</button>
  <div class="note">Your home directory (~) is saved first. Everything else starts fresh.</div>
</div>
<div id="term"></div>
<div id="keys">
  <button data-k="\x1b">esc</button>
  <button data-k="\t">tab</button>
  <button id="ctrl">ctrl</button>
  <button data-k="\x1b[A">↑</button>
  <button data-k="\x1b[B">↓</button>
  <button data-k="\x1b[D">←</button>
  <button data-k="\x1b[C">→</button>
  <button data-k="|">|</button>
  <button data-k="/">/</button>
  <button data-k="-">-</button>
  <button data-k="\x03">^C</button>
  <button id="kbd">⌨ keyboard</button>
</div>
<div id="screen_container"><div></div><canvas></canvas></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="build/libv86.js"></script>
<script>
// ── The app side of entity-apps' contract, plus the file verbs it lacks ────────
//   app → host : ready-for-init · state · ready · closed · error
//   host → app : init {state} · viewport · request-state · destroy
// ⚠ The `x-` file verbs are a PROTOTYPE, deliberately un-minted: entity-apps owns
// EMBEDDING.md, and minting vocabulary a counterpart also implements is the
// mistake G-PIN-4 and the SHARE divergence both paid for.
const HOST = 'entity-host', APP = 'entity-app';
const send = (t, x) => parent !== window &&
  parent.postMessage(Object.assign({ source: APP, type: t }, x || {}), '*');
const $ = id => document.getElementById(id);
const t0 = performance.now();

let emulator = null, booted = false, prompted = false, serial = '', pending = null;

// ── assets from the HOST, when the host offers them ───────────────────────────
// Hosted in an entity-app player, this page is an opaque-origin document: its
// relative URLs resolve against the HOST page, where none of these files are.
// So the player serves them. The catalog declares two bundles and `init` says
// which ones this host answers for (`x-assets`); the page asks for a KEY in a
// bundle with `x-asset-get` and gets bytes or a refusal code back. The host
// does not know what any key means -- that is the whole contract.
//   engine : v86.wasm · seabios.bin · vgabios.bin      (changes with OUR builds)
//   image  : vmlinuz · initramfs · fs.json · blobs/<sha256>   (the environment)
// Standalone (no host, or a host that offers nothing) nothing below runs and
// the page fetches the same files by URL, exactly as before.
let hostBundles = null;             // null = URL mode; a Set = host mode
let assetSeq = 0;
const assetWaiting = new Map();
function hostAsset(bundle, key) {
  return new Promise((resolve, reject) => {
    const id = 'a' + (++assetSeq);
    assetWaiting.set(id, { resolve, reject, bundle, key });
    window.__m1.assets.requests++;
    const per = window.__m1.assets.byBundle[bundle] = window.__m1.assets.byBundle[bundle] || { requests: 0, bytes: 0 };
    per.requests++;
    send('x-asset-get', { id, bundle, key });
  });
}
function onHostAsset(m) {
  const w = assetWaiting.get(m.id);
  if (!w) return;
  assetWaiting.delete(m.id);
  if (m.ok && m.data) {
    const bytes = new Uint8Array(m.data);
    window.__m1.assets.bytes += bytes.byteLength;
    window.__m1.assets.byBundle[w.bundle].bytes += bytes.byteLength;
    w.resolve(bytes);
  } else {
    window.__m1.assets.refused++;
    window.__m1.assets.lastRefusal = `${w.bundle}/${w.key}: ${m.reason}`;
    w.reject(new Error(`the host did not serve ${w.bundle}/${w.key} (${m.reason})`));
  }
}
// A buffer handed to v86 is kept by it; give it one that is exactly the file.
const exactBuffer = u8 => (u8.byteOffset === 0 && u8.byteLength === u8.buffer.byteLength)
  ? u8.buffer : u8.slice().buffer;

// Diagnostics live HERE, not on screen. A probe reads them; a person reads the
// terminal. (The previous page put a JSON dump across 80% of the viewport --
// that was a measurement rig mistaken for the product.)
window.__m1 = { serial:'', booted:false, probeOk:false, bootMs:null, promptMs:null,
                error:null, net:null,
                assets:{ requests:0, bytes:0, refused:0, lastRefusal:null, mode:'url', byBundle:{} },
                env:{ crossOriginIsolated: (typeof crossOriginIsolated!=='undefined') ? crossOriginIsolated : 'undefined',
                      SharedArrayBuffer_present: (typeof SharedArrayBuffer!=='undefined'),
                      sandboxed: window.origin === 'null',
                      ua: navigator.userAgent.slice(0,90) } };

function netStats() {
  const rs = performance.getEntriesByType('resource');
  // transferred vs consumed are DIFFERENT FACTS: a cache hit reports
  // transferSize 0, so `transferSize || encodedBodySize` bills every cache hit at
  // full size and invents a 5x blow-up that is not happening.
  const pick = p => { const m = rs.filter(p); return {
      n:m.length, bytes:m.reduce((a,r)=>a+(r.transferSize||0),0),
      consumed:m.reduce((a,r)=>a+(r.encodedBodySize||0),0) }; };
  const names = rs.filter(r=>r.name.includes('/blobs/')).map(r=>r.name);
  const blobs = pick(r=>r.name.includes('/blobs/'));
  blobs.distinct = new Set(names).size;
  blobs.repeats = names.length - blobs.distinct;
  blobs.cacheHits = rs.filter(r=>r.name.includes('/blobs/') &&
                      r.transferSize===0 && r.decodedBodySize>0).length;
  return { blobs, kernel:pick(r=>/vmlinuz|initramfs/.test(r.name)),
           engine:pick(r=>/v86\.wasm|libv86\.js/.test(r.name)),
           index:pick(r=>/fs\.json/.test(r.name)), total_requests:rs.length };
}
const strip = s => s.replace(/\x1b\[[0-9;?]*[a-zA-Z]/g, '');
const mib = n => (n/1048576).toFixed(1);

const term = new Terminal({ convertEol:false, fontSize:13, scrollback:5000,
                            theme:{ background:'#1a1a1a' } });
term.open($('term'));

// ── the fit trace ─────────────────────────────────────────────────────────────
// "Did the terminal paint?" is a SAMPLING question, not a final-state one. At the
// prompt the page calls fitAndTell() itself, so a frame that painted nothing for
// eight seconds and one that painted throughout end up IDENTICAL at the end --
// which is how an end-state assertion about the ResizeObserver passed with the
// observer deleted. What separates them is the middle of the boot.
window.__m1.fit = [];
function sampleFit(why) {
  const el = document.querySelector('.xterm-rows');
  window.__m1.fit.push({ t: Math.round(performance.now() - t0), why,
    rows: term.rows, cols: term.cols,
    h: Math.round($('term').getBoundingClientRect().height),
    painted: el ? el.children.length : 0,
    chars: el ? el.innerText.replace(/\s+/g, '').length : 0 });
}
setInterval(() => sampleFit('tick'), 250);

// ── Fit, and TELL THE GUEST ───────────────────────────────────────────────────
// Without this xterm renders at its default 80x24 = 624px. Measured in a 464px
// frame: the right third clipped, 21 unused rows as a black rectangle -- which on
// a phone reads as "the app is broken", which is how it was reported.
// Fitting is half of it. A serial console has NO window size: the kernel answers
// TIOCGWINSZ 0x0 until something states it, so full-screen programs refuse to
// start. Nothing carries a browser resize into a 16550, so the guest's agent
// runs `stty` on the console for us, told over the control line (ttyS1).
// ⚠ IT USED TO BE TYPED INTO THE SHELL: `stty rows R cols C` echoed on every
// resize, and with vi or nano open it typed those words INTO THE FILE. Reported
// on a phone, where rotating and opening the keyboard both resize.
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
let lastSize = '';
function fitAndTell() {
  try { fit.fit(); } catch (e) { return; }
  const size = term.rows + 'x' + term.cols;
  if (!agentReady || size === lastSize) return;     // `hello` resends it
  lastSize = size;
  toAgent(`size ${term.rows} ${term.cols}`);
}

// ── the control line: ttyS1, which no person sees ─────────────────────────────
// The guest's agent (build-guest.sh 3d) reads fixed verbs here and answers
// `hello` when it starts and `manifest TOK N` when a listing is ready. Nothing
// the page sends is ever run as a command, and nothing touches the person's shell.
let agentReady = false, agentBuf = '';
const agentWaiters = new Map();
function toAgent(line) {
  if (!emulator) return;
  // One line, always: a newline inside a result would start a second verb.
  const clean = String(line).replace(/[\r\n]+/g, ' ').slice(0, 900);
  emulator.serial_send_bytes(1, new TextEncoder().encode(clean + '\n'));
}
function onAgentLine(line) {
  const [verb, tok, n] = line.split(' ');
  if (verb === 'hello') {
    const first = !agentReady;
    agentReady = true;
    window.__m1.agent = window.__m1.agent || { hello: [] };
    window.__m1.agent.hello.push(since());
    lastSize = ''; fitAndTell();
    if (first) workspaceBaseline();
    if (first && SNAPSHOT_BUILD) buildSnapshot();
  } else if (verb === 'manifest') {
    const w = agentWaiters.get(tok);
    if (w) { agentWaiters.delete(tok); w(Number(n)); }
  } else if (verb === 'resumed' || verb === 'zeroed' || verb === 'received' || verb === 'shell') {
    const w = agentWaiters.get(tok);
    if (w) { agentWaiters.delete(tok); w(line.split(' ').slice(2)); }
  }
}
// Ask the agent one fixed verb and wait for its answer line, or fail after `ms`.
function askAgent(verb, args, ms) {
  const tok = token();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { agentWaiters.delete(tok); reject(new Error(`the machine did not answer ${verb}`)); }, ms);
    agentWaiters.set(tok, v => { clearTimeout(timer); resolve(v); });
    toAgent([verb, tok, ...args].join(' '));
  });
}
const token = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => b.toString(16).padStart(2, '0')).join('');
addEventListener('resize', () => setTimeout(fitAndTell, 150));
// A phone rotating or opening its keyboard changes the visual viewport without
// firing a useful `resize` on some browsers.
if (window.visualViewport) visualViewport.addEventListener('resize', () => setTimeout(fitAndTell, 150));
// ⚠ THE COMMENT THAT WAS HERE WAS WRONG, and the correction is worth more than
// the observer. It claimed "neither `resize` nor `visualViewport` fires -- the
// element changed, not the window". FALSE FOR AN IFRAME: resizing the frame
// element IS resizing its inner window, so both fire inside it. Measured with the
// frame grown from 0 after load, first fit in ms (`fit-trace.py`):
//
//     RO  resize  vVP   first fit
//      Y     Y      Y        764    <- today
//      N     Y      Y       1016
//      N     N      Y       1014
//      N     Y      N       1014
//      N     N      N       8062    <- THE REPORTED SYMPTOM, exactly: one row and
//                                      zero characters for the whole boot, then
//                                      it snaps when the prompt fits itself
//
// So ANY ONE of the three recovers it, and the observer buys ~250ms by being the
// only one with no 150ms debounce in front of it. ⚠ THIS RIG CANNOT SHOW THE CASE
// THE OBSERVER IS ACTUALLY FOR -- an element resizing while the window does not (a
// late flex/height resolution, a font load) -- because resizing a frame moves
// both. Keep it for that case; do not claim this measured it. And the last row is
// still reachable: if NOTHING ever changes size after term.open(), none of the
// three fire and the terminal stays blank until the prompt.
if (window.ResizeObserver) new ResizeObserver(() => fitAndTell()).observe($('term'));
fit.fit();

// ── The key bar, and the keyboard a phone will not open by itself ─────────────
// Tapping a terminal does not summon a mobile keyboard: xterm's input target is a
// hidden helper textarea and a touch on the canvas does not focus it.
let ctrl = false;
function focusKeyboard() {
  const ta = document.querySelector('.xterm-helper-textarea');
  if (ta) { ta.focus(); ta.click(); }
  term.focus();
}
$('kbd').addEventListener('click', focusKeyboard);
$('term').addEventListener('touchstart', focusKeyboard, { passive:true });
$('ctrl').addEventListener('click', () => {
  ctrl = !ctrl; $('ctrl').classList.toggle('on', ctrl);
  focusKeyboard();
});
// A key-bar tap must NOT take focus from the terminal's input. On a phone the
// soft keyboard belongs to whatever is focused, so tapping `ctrl` closed it --
// and then there was no keyboard to type the letter Ctrl was meant to combine
// with. preventDefault on pointerdown suppresses the focus change and leaves
// the click intact. (Reported on Android Chrome: stuck in nano, no way to ^X.)
for (const b of document.querySelectorAll('#keys button')) {
  b.addEventListener('pointerdown', e => e.preventDefault());
}
// Ctrl + a key typed on the REAL keyboard. The armed flag was only ever read by
// the key-bar handler below, and the key bar has no letters -- so Ctrl combined
// with nothing a person could actually type. `^X` is caret notation: Ctrl+X is
// byte 0x18, i.e. the letter's code minus 64, and the same rule covers @ [ \ ] ^ _.
function applyCtrl(d) {
  if (!ctrl || d.length !== 1) return d;
  const c = d.toUpperCase().charCodeAt(0);
  ctrl = false; $('ctrl').classList.remove('on');
  if (c >= 64 && c <= 95) return String.fromCharCode(c - 64);
  if (d === ' ') return '\x00';
  if (d === '?') return '\x7f';
  return d;                                   // no control form: send it plain
}
for (const b of document.querySelectorAll('#keys button[data-k]')) {
  b.addEventListener('click', () => {
    let k = b.dataset.k.replace(/\\x1b/g,'\x1b').replace(/\\t/g,'\t').replace(/\\x03/g,'\x03');
    if (ctrl && k.length === 1 && /[a-z]/i.test(k)) {
      k = String.fromCharCode(k.toUpperCase().charCodeAt(0) - 64);
      ctrl = false; $('ctrl').classList.remove('on');
    }
    typeIn(k);
    focusKeyboard();
  });
}

// Everything typed reaches the guest as UTF-8 BYTES. v86's `serial0_send(str)`
// sends each character's code as ONE byte, so `é` arrived as Latin-1 0xE9 and
// anything past U+00FF was truncated -- a file named on a phone keyboard came out
// as a different name. Found when the probe sent a non-ASCII file name.
const utf8 = new TextEncoder();
function typeIn(text) {
  emulator && emulator.serial_send_bytes(0, utf8.encode(text));
}

function status(text, cls) { $('status').textContent = text; $('status').className = cls || 'dim'; }

// ── the download phase, which is the actual black box ─────────────────────────
// The kernel log scrolling by is good feedback. The window BEFORE it is not:
// 14.3 MiB of kernel + initramfs + engine has to arrive before the guest emits
// its first byte, and until it does the page says "booting the kernel…" while it
// is in fact still downloading one. On this desktop that is ~2s and forgivable;
// on a phone on a bad link it is tens of seconds of a screen that looks broken,
// and THAT is when someone hits back not knowing they were nearly there.
// So: say which phase we are in, and put a number on the one that has no other
// evidence it is progressing. Still ONE LINE -- the detail goes to __m1.
const dl = { files: new Map(), done: false, firstMs: null, lastMs: null };
window.__m1.phases = { boot_called: null, first_progress: null,
                       download_done: null, first_serial: null, prompt: null };
const since = () => Math.round(performance.now() - t0);

function onProgress(e) {
  // `total` can be absent on a chunked response, so a file we cannot size is
  // counted in the "unknown" column rather than silently scored as 0 bytes --
  // a progress bar that quietly under-reports its denominator runs backwards.
  const prev = dl.files.get(e.file_name) || { loaded: 0, total: 0 };
  dl.files.set(e.file_name, { loaded: e.loaded || 0,
                              total: (e.total && e.total > 0) ? e.total : prev.total });
  if (dl.firstMs === null) { dl.firstMs = since(); window.__m1.phases.first_progress = dl.firstMs; }
  dl.lastMs = since();
  if (dl.done) return;                       // the guest is talking; it owns the line now
  let loaded = 0, total = 0, unsized = 0;
  for (const f of dl.files.values()) { loaded += f.loaded; total += f.total; if (!f.total) unsized++; }
  window.__m1.dl = { loaded, total, files: dl.files.size, unsized };
  status(total
    ? `fetching the environment… ${mib(loaded)} / ${mib(total)} MiB`
    : `fetching the environment… ${mib(loaded)} MiB`);
}

// ── the userland phase, which is the REAL black box ───────────────────────────
// Measured at 3000 kbps: the download phase is 39.6s and now reports a moving
// number, then "root mounted — starting userland…" sits there for TWENTY-SEVEN
// SECONDS with nothing on screen changing at all. That is the stretch that gets
// the back button, and it was invisible over loopback where it is under 2s.
// Nothing is wrong during it: Alpine's init is reading files, each read faults a
// blob over HTTP, and userland is simply silent until the shell starts. So the
// work is real and only the EVIDENCE of it is missing -- which is the cheap half.
// The blobs do not come through `download-progress` (that covers the six startup
// files only), so they are counted from the resource timeline, which is the same
// instrument netStats() already reads.
// ⚠ AND THE GAP THAT IS LEFT IS A PROPERTY OF THE INSTRUMENT, so it is reported
// rather than papered over. A `resource` entry only exists once a request has
// COMPLETED, so one large blob is invisible for its entire transfer -- measured,
// an 8.8s freeze at 3000 kbps that is a single 3.2 MiB read. A spinner would
// cover it with motion that means nothing. The elapsed time since the last
// completed read means something exactly: it is how long the guest has been
// blocked on one thing, so a big file and a wedge are told apart by whether the
// number stops. (`handle9p` is where this stops being a limitation -- when WE
// issue the fetch we can report its bytes. Third independent argument for it,
// and the first that a person can see.)
let ticker = null, lastReads = 0, lastReadAt = 0;
function startUserlandTicker() {
  if (ticker) return;
  lastReadAt = since();
  ticker = setInterval(() => {
    if (prompted) { clearInterval(ticker); ticker = null; return; }
    const rs = performance.getEntriesByType('resource').filter(r => r.name.includes('/blobs/'));
    if (!rs.length) return;
    const bytes = rs.reduce((a, r) => a + (r.transferSize || 0), 0);
    if (rs.length !== lastReads) { lastReads = rs.length; lastReadAt = since(); }
    const waited = Math.round((since() - lastReadAt) / 1000);
    window.__m1.userland = { reads: rs.length, bytes, waited };
    // "reads", not "files": v86 re-requests the same blob up to 44x, so a file
    // count here would be a number that lies rather than a number that moves.
    // If a read is outstanding we now know its SIZE, because the miss carried it.
    // ⚠ SIZE AND ELAPSED ARE BOTH NEEDED, and trading one for the other REDS THE
    // GATE -- which is what happened here: "reading 3.2 MiB" is more specific
    // than "waiting 6s" and it is STATIC, so an 8.8s read froze the screen again
    // with a better sentence on it. Specific says what it is stuck on; moving
    // says it is still alive. A progress line owes both.
    const r = window.__m1.retain;
    const busy = r && r.installed && r.inflight.length && r.reading;
    let tail = busy ? ` · reading ${mib(r.reading.size)} MiB` : '';
    if (waited >= 2) tail += ` · ${waited}s`;
    status(`starting userland… ${rs.length} reads · ${mib(bytes)} MiB${tail}`);
  }, 400);
}

// ── the storage seam, which is NOT handle9p ───────────────────────────────────
// `handle9p` is `fn(requestBytes, reply)` -- the RAW 9P2000.L WIRE PROTOCOL. Read
// the engine: `a.handle9p ? new ld(a.handle9p, this)` and `ld` hands our function
// the bytes off the virtqueue with the tag already parsed. Implementing it means
// implementing Tversion/Tattach/Twalk/Tlopen/Tread/Treaddir/Tgetattr/Tclunk/…,
// i.e. re-writing v86's own 9p server. That is NOT the half-day the last handoff
// priced, and it is not what any of our three arguments actually needed.
//
// WHAT THEY NEEDED IS THIS, AND IT IS THREE METHODS:
//     read(sha256, offset, count, size) -> Uint8Array | null
//     cache(sha256, bytes)
//     uncache(sha256)
// at `emulator.fs9p.storage` (`function N(a,b){…this.storage=a…}`).
//
// ⚠ AND READING IT EXPLAINS THE 44x REFETCH, which was measured and never
// diagnosed. `N.prototype.CloseInode` does `2 === b.status &&
// this.storage.uncache(b.sha256sum)` -- v86 EVICTS A FILE FROM MEMORY WHEN THE
// GUEST CLOSES IT. Every busybox applet invocation re-opens and re-fetches. It is
// a deliberate memory bound in the engine, not a bug, and the browser's heuristic
// HTTP cache is the only thing standing between it and the 2.6x that `…-l` A/B'd.
// Suppressing the eviction removes the dependency on a cache nobody instructed.
//
// The whole userland is 7.1 MiB, so a budget is a guard rather than a policy --
// but it is a REAL guard: a guest that reads a large file it then rewrites would
// otherwise grow this map without limit.
const RETAIN_BUDGET = 64 * 1024 * 1024;
// ⚠ `emulator.fs9p` DOES NOT EXIST WHEN `new V86()` RETURNS. The engine awaits its
// own wasm before building the filesystem, so a synchronous install reads
// undefined and reports "not installed" -- which is what the first cut did, and

  }
  const [st, dest64] = answer;
  if (st !== 'ok' || !dest64) {
    status(`could not take ${name} (${st})`, 'bad');
    window.__m1.files.received.push({ name, length: bytes.byteLength, error: st });
    return;
  }
  const dest = textOfB64(dest64);
  window.__m1.files.received.push({ name, dest, length: bytes.byteLength });
  status(`received ${name} → ~/${dest}`, 'ok');
  redrawPrompt();                  // the agent printed a line under the prompt
  saveWorkspace('received');
}

// ── the workspace: /root, kept by the host ────────────────────────────────────
// The host keeps an app's working files in the entity tree, one entity per file
// (`x-workspace`, src/apps/workspace.rs). This page decides what that means for
// a machine:
//
//   LAUNCH  list + fetch every file, write ONE tar onto the guest disk at
//           /var/lib/entity/restore.tar BEFORE starting the CPU; the guest's
//           sysinit extracts it into /root before any shell starts. A tar, not
//           a file per create_file: it carries the mode (an executable stays
//           executable), the mtime, and creates directories.
//   SAVE    ask the agent for a manifest of /root (mode mtime size path), diff
//           it against what we believe the host holds, and send only what
//           changed. Every 30 s, when the page is hidden, and on `save`.
//
// ⚠ WHAT MAY BE DELETED IS DECIDED HERE, AND NARROWLY. A path is only removed
// from the host if THIS SESSION saw it on the guest's disk and then saw it gone.
// A file the host holds that never appeared (a restore that failed, a file too
// big to fetch) is left alone — a broken restore must never be the reason a
// person's work is deleted on the next autosave.
let hostWorkspace = false;           // `init` said the host keeps files
let hostSigs = new Map();            // path -> sig, as the host listed them at launch
let known = null;                    // path -> sig we believe the host holds (null = no baseline yet)
let saving = null;

const workWaiting = new Map();
let workSeq = 0;
function workRequest(type, body, ms) {
  return new Promise((resolve, reject) => {
    const id = 'w' + (++workSeq);
    const timer = setTimeout(() => { workWaiting.delete(id); reject(new Error(`${type}: no answer from the host`)); }, ms || 60000);
    workWaiting.set(id, m => { clearTimeout(timer); resolve(m); });
    const transfer = (body.put || []).map(p => p.data);
    parent.postMessage(Object.assign({ source: APP, type, id }, body), '*', transfer);
  });
}
function onWorkReply(m) {
  const w = workWaiting.get(m.id);
  if (w) { workWaiting.delete(m.id); w(m); }
}
const sigOf = (mode, mtime, size) => `${mode}:${mtime}:${size}`;

async function fetchWorkspace() {
  const listing = await workRequest('x-work-list', {});
  if (!listing.ok) throw new Error(`the host did not list the workspace (${listing.reason})`);
  const files = listing.files || [];
  const got = [];
  let next = 0, failed = 0;
  // A few at a time: a workspace can hold thousands of small files.
  async function worker() {
    while (next < files.length) {
      const f = files[next++];
      const r = await workRequest('x-work-get', { path: f.path }).catch(() => null);
      if (r && r.ok && r.data) got.push({ f, data: new Uint8Array(r.data) });
      else failed++;
    }
  }
  await Promise.all(Array.from({ length: Math.min(8, files.length) }, worker));
  for (const { f } of got) hostSigs.set(f.path, sigOf(f.mode, f.mtime, f.size));
  window.__m1.work.restored = got.length;
  window.__m1.work.restoreFailed = failed + (listing.unreadable || []).length;
  return { tar: got.length ? makeTar(got) : null, count: got.length, failed };
}

// A POSIX ustar archive. Names up to 255 bytes (prefix + name); longer ones are
// skipped and counted, never truncated into a different path.
function makeTar(entries) {
  const enc = new TextEncoder();
  const blocks = [];
  const field = (buf, off, len, str) => { const b = enc.encode(str); buf.set(b.subarray(0, len), off); };
  const octal = (n, len) => n.toString(8).padStart(len - 1, '0') + '\0';
  for (const { f, data } of entries) {
    const name = enc.encode(f.path);
    let pre = '', base = f.path;
    if (name.length > 100) {
      const cut = f.path.lastIndexOf('/', f.path.length - 1);
      pre = cut > 0 ? f.path.slice(0, cut) : '';
      base = cut > 0 ? f.path.slice(cut + 1) : f.path;
      if (enc.encode(pre).length > 155 || enc.encode(base).length > 100) { window.__m1.work.restoreFailed++; continue; }
    }
    const h = new Uint8Array(512);
    field(h, 0, 100, base);
    field(h, 100, 8, octal(f.mode & 0o7777, 8));
    field(h, 108, 8, octal(0, 8));
    field(h, 116, 8, octal(0, 8));
    field(h, 124, 12, octal(data.length, 12));
    field(h, 136, 12, octal(Math.max(0, Math.floor(f.mtime)), 12));
    field(h, 148, 8, '        ');
    h[156] = 0x30;                                    // '0': a regular file
    field(h, 257, 6, 'ustar\0');
    field(h, 263, 2, '00');
    field(h, 345, 155, pre);
    let sum = 0; for (const b of h) sum += b;
    field(h, 148, 8, sum.toString(8).padStart(6, '0') + '\0 ');
    blocks.push(h, data);
    const pad = (512 - (data.length % 512)) % 512;
    if (pad) blocks.push(new Uint8Array(pad));
  }
  blocks.push(new Uint8Array(1024));
  const total = blocks.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let o = 0; for (const b of blocks) { out.set(b, o); o += b.length; }
  return out;
}

// On the disk before the CPU runs. `fs9p` is built by the engine asynchronously;
// `emulator-loaded` is after it, but wait for it anyway rather than trust order.
async function placeRestore(restore) {
  if (!restore) return;
  if (restore.error) {
    window.__m1.work.restoreError = restore.error;
    status('your saved files could not be fetched: ' + restore.error.slice(0, 80), 'bad');
    return;
  }
  if (!restore.tar) return;
  for (let i = 0; i < 200 && !emulator.fs9p; i++) await new Promise(r => setTimeout(r, 10));
  try {
    await emulator.create_file('var/lib/entity/restore.tar', restore.tar);
    window.__m1.work.placedMs = since();
  } catch (e) {
    window.__m1.work.restoreError = 'could not place the archive: ' + e;
  }
}

// After a snapshot restore: the guest woke with the clock, the RNG state and the
// files of the moment the snapshot was taken, for every visitor, and its agent
// is already running (it said hello at build time, not now). So the page tells

// treats the machine as ready.
const SHELL_REFRESH_KEY = '\x1b[9999~';
async function afterResume(restore) {
  const st = window.__m1.snapshot;

  let archive = '-';
  if (restore && restore.error) {
    window.__m1.work.restoreError = restore.error;
  } else if (restore && restore.tar) {
    // A fresh name each time: this root is cache=loose, and a name the guest
    // already looked up (and did not find) at build time may be remembered.
    archive = `restore-${token()}.tar`;
    for (let i = 0; i < 200 && !emulator.fs9p; i++) await new Promise(r => setTimeout(r, 10));
    try { await emulator.create_file('var/lib/entity/' + archive, restore.tar); window.__m1.work.placedMs = since(); }
    catch (e) { window.__m1.work.restoreError = 'could not place the archive: ' + e; archive = '-'; }
  }
  const seed = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(64))));
  try {
    const [files, rng] = await askAgent('resume', [Math.floor(Date.now() / 1000), seed, archive], 20000);
    st.files = files; st.rng = rng;
    if (files === 'failed' || files === 'missing') window.__m1.work.restoreError = `the saved files were not restored (${files})`;
  } catch (e) {

    return;
  }

  agentReady = true;

  window.__m1.agent.resumed = st.readyMs;

  // the history just restored into ~ and the $RANDOM sequence every visitor
  // shares. Press the one key sequence its profile binds to a refresh
  // (build-guest.sh 3), then ask the agent whether it ran; if not, the agent
  // replaces the shell. ⚠ THE ONE EXCEPTION to "the page never types into the
  // shell": a readline key binding, not a command, sent once, before the
  // terminal is handed to anyone. Nothing reaches the command line, and readline
  // redraws the prompt the snapshot drew into a terminal that no longer exists.
  typeIn(SHELL_REFRESH_KEY);
  try { [st.shell] = await askAgent('shell', [], 5000); }
  catch (e) { st.shell = 'no answer'; }
  if (st.shell !== 'refreshed' && st.shell !== 'replaced') await redrawPrompt();
  lastSize = ''; fitAndTell();
  workspaceBaseline();
  if (!prompted) {
    prompted = true;
    window.__m1.promptMs = window.__m1.phases.prompt = Math.round(performance.now() - t0);
    status(`resumed in ${(window.__m1.promptMs / 1000).toFixed(1)}s`, 'ok');
    send('ready');
  }
}

// Make whatever is on the console redraw: bash (readline) redraws its prompt and
// the line being typed on SIGWINCH, and vi or nano redraw their screen -- which
// is what repairs a line the agent printed underneath either (measured). The
// size may already equal this one, so change it twice: one column wider, then real.
async function redrawPrompt() {
  if (!agentReady) return;
  try { fit.fit(); } catch (e) {}
  toAgent(`size ${term.rows} ${term.cols + 1}`);
  await new Promise(r => setTimeout(r, 250));
  lastSize = ''; fitAndTell();
}

// BUILD TIME (?snapshot=build, standalone): boot cold, zero free memory, save the
// state, gzip it for the builder to copy out. build-snapshot.py drives this.
async function buildSnapshot() {
  const out = window.__snapshotOut = { phase: 'waiting for the prompt' };
  try {
    for (let i = 0; i < 600 && !prompted; i++) await new Promise(r => setTimeout(r, 100));
    await new Promise(r => setTimeout(r, 3000));            // let the boot's tail settle
    out.phase = 'zero-filling';
    await askAgent('zerofill', [], 120000);
    await new Promise(r => setTimeout(r, 1000));
    out.phase = 'saving';
    const state = await emulator.save_state();
    const gz = new Uint8Array(await new Response(new Blob([state]).stream()
      .pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    Object.assign(out, { phase: 'ready', raw: state.byteLength, gzip: gz, ids: window.__m1.snapshot.ids });
  } catch (e) {

async function guestManifest() {
  const tok = token();
  const count = await new Promise((resolve, reject) => {
    const timer = setTimeout(() => { agentWaiters.delete(tok); reject(new Error('the machine did not list /root')); }, 30000);
    agentWaiters.set(tok, n => { clearTimeout(timer); resolve(n); });
    toAgent(`manifest ${tok}`);
  });
  const out = new Map();
  // ⚠ v86's read_file REJECTS AN EMPTY FILE with "File not found" (it reads
  // `size` bytes, gets null for zero, and treats null as absent). An empty /root
  // -- every fresh profile -- is an empty manifest, so the agent's own count
  // decides, and a zero is never read. Found by the gate, on its first run.
  if (!count) return out;
  const lines = await emulator.read_file('var/lib/entity/manifest');
  for (const line of new TextDecoder().decode(lines).split('\n')) {
    const m = /^([0-7]+) (\d+) (\d+) \.\/(.+)$/.exec(line);
    if (!m) continue;
    const mode = parseInt(m[1], 8), mtime = Number(m[2]), size = Number(m[3]);
    out.set(m[4], { mode, mtime, size, sig: sigOf(mode, mtime, size) });
  }

}

// The first manifest after the agent says hello. What the host holds is the
// baseline for a path it listed; for a path it did not (a file the IMAGE put in
// /root) the guest's own copy is, so an untouched image file is never uploaded.
let timersArmed = false;
async function workspaceBaseline() {
  if (!hostWorkspace || known) return;
  try {
    const current = await guestManifest();
    known = new Map();
    for (const [path, e] of current) known.set(path, hostSigs.has(path) ? hostSigs.get(path) : e.sig);
    window.__m1.work.baselineMs = since();
    delete window.__m1.work.baselineError;
  } catch (e) {
    // Not fatal: the next save tries again. A baseline that failed once must not
    // switch saving off for the whole session.
    window.__m1.work.baselineError = String(e);
  }
  if (!timersArmed) {
    timersArmed = true;
    setInterval(() => saveWorkspace('auto'), 30000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveWorkspace('hidden'); });
  }
}

const kb = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;
const MAX_FILE = 32 * 1048576, MAX_BATCH = 48 * 1048576;

function saveWorkspace(reason) {
  if (!hostWorkspace) return Promise.resolve({ ok: false, text: 'nothing keeps files here -- open this machine from the entity browser' });
  if (!agentReady) return Promise.resolve({ ok: false, text: 'the machine is still starting -- try again in a moment' });
  // One at a time; a request that arrives during a save runs after it, so an
  // explicit `save` always reflects the disk as it is when it was typed.
  const run = (saving || Promise.resolve()).then(() => doSave(reason));
  const tail = run.catch(() => {});
  saving = tail;
  tail.then(() => { if (saving === tail) saving = null; });
  return run.catch(e => ({ ok: false, text: String(e).slice(0, 200) }));
}

async function doSave(reason) {
  lastSaveAt = since();
  if (!known) {
    await workspaceBaseline();
    if (!known) throw new Error(window.__m1.work.baselineError || 'could not list /root');
  }
  const current = await guestManifest();
  const changed = [], removed = [];
  for (const [path, e] of current) if (known.get(path) !== e.sig) changed.push([path, e]);
  for (const path of known.keys()) if (!current.has(path)) removed.push(path);
  if (!changed.length && !removed.length) {
    window.__m1.work.last = { reason, nothing: true, at: since() };
    window.__m1.work.recent.push(window.__m1.work.last);
    if (window.__m1.work.recent.length > 12) window.__m1.work.recent.shift();
    return { ok: true, text: 'nothing changed' };
  }

  const failed = [], savedPaths = [];
  let batch = [], batchBytes = 0;
  const flush = async (rm) => {
    if (!batch.length && !rm.length) return;
    const r = await workRequest('x-work-save', { put: batch.map(b => b.msg), remove: rm }, 120000);
    if (!r.ok && r.reason) {                       // the whole batch was refused
      for (const b of batch) failed.push(`${b.path} (${r.reason})`);
    } else {
      const bad = new Map((r.failed || []).map(f => [f.path, f.reason]));
      for (const b of batch) {
        if (bad.has(b.path)) {
          failed.push(`${b.path} (${bad.get(b.path)})`);
          // A path the host will never accept is not retried every 30 s.
          if (bad.get(b.path) === 'bad-path' || bad.get(b.path) === 'bad-mode') known.set(b.path, b.sig);
        } else { known.set(b.path, b.sig); saved++; bytes += b.size; savedPaths.push(b.path); }

    }
    batch = []; batchBytes = 0;
  };
  for (const [path, e] of changed) {
    if (e.size > MAX_FILE) { failed.push(`${path} (over ${kb(MAX_FILE)})`); known.set(path, e.sig); continue; }
    let data;
    try { data = (await emulator.read_file('root/' + path)).slice(); }
    catch (err) { failed.push(`${path} (unreadable)`); continue; }
    if (batchBytes + data.length > MAX_BATCH) await flush([]);
    batch.push({ path, sig: e.sig, size: data.length, msg: { path, mode: e.mode, mtime: e.mtime, data: data.buffer } });
    batchBytes += data.length;

  if (saved) parts.push(`${saved} file${saved === 1 ? '' : 's'} saved (${kb(bytes)})`);
  if (gone) parts.push(`${gone} removed`);
  if (failed.length) parts.push(`not saved: ${failed.slice(0, 3).join(', ')}${failed.length > 3 ? ` and ${failed.length - 3} more` : ''}`);
  const text = (parts.join(', ') || 'nothing saved') + (failed.length ? '' : ' -- kept in this browser');
  if (reason !== 'command' && (saved || gone || failed.length)) status(`saved ~: ${parts.join(', ')}`, failed.length ? 'bad' : 'ok');
  return { ok: !failed.length, text };
}

// A command finished (the shell's PROMPT_COMMAND, build-guest.sh 3). Save a
// moment later, and not more often than every SAVE_SPACING_MS: a save lists the
// home directory on the emulated CPU, and a person typing commands back to back
// should not pay for one each. The Apps window closes an app without warning, so
// this bounds what a close loses to the last few seconds, not 30.
const PROMPT_SAVE_DELAY_MS = 1500, SAVE_SPACING_MS = 5000;
let lastSaveAt = -1e9, promptSaveTimer = null;
function onPromptPing() {
  if (!hostWorkspace || !agentReady || powering || promptSaveTimer) return;
  const wait = Math.max(PROMPT_SAVE_DELAY_MS, lastSaveAt + SAVE_SPACING_MS - since());
  promptSaveTimer = setTimeout(() => { promptSaveTimer = null; if (!powering) saveWorkspace('prompt'); }, wait);
}

// ── power: restart, restart showing the boot, turn off, start ─────────────────
// The machine lives in this page, so turning it off and on is the page's job,
// never the guest's: a reboot INSIDE a resumed guest has no kernel to boot (a
// resume never fetched one), and a poweroff inside it leaves a dead terminal and
// an unsaved home directory. `reboot`/`poweroff` in the guest ask for this too.
//
// A restart is a RELOAD of this document, not an emulator rebuilt in place: the
// page holds a dozen pieces of per-machine state (the agent, the workspace
// baseline, retained blobs, timers, the snapshot decision), and a reload resets
// every one of them by construction where a hand-written reset would miss the
// next one added. The host answers the second `ready-for-init` like the first.
// How to start next goes across the reload in `window.name`, which a sandboxed
// opaque-origin frame keeps across its own reload (measured, Firefox and Chrome)
// and which is the only storage such a frame has.
// `?boot=cold` asks for the same by URL: a standalone page (no power button has
// been pressed yet) can then show the boot, and a probe that measures the boot
// itself can get one while a snapshot is published beside the page.
const POWER_ON = (() => {
  try {
    const v = JSON.parse(window.name || 'null');
    if (v && v.entityVm) { window.name = ''; return { boot: v.entityVm.boot === 'cold' ? 'cold' : 'resume', note: v.entityVm.note || null, by: v.entityVm.by || null }; }
  } catch (e) {}
  let byUrl = null;
  try { byUrl = new URLSearchParams(location.search).get('boot'); } catch (e) {}

window.__m1.power = { started: POWER_ON, actions: [] };
if (POWER_ON.note) term.write(`\x1b[2m[${POWER_ON.note}]\x1b[0m\r\n`);

let powering = false, poweredOff = false;
async function power(what, by) {
  if (powering) return;

  window.__m1.power.actions.push(log);
  if (what === 'start' || what === 'start-cold') {
    startAgain(what === 'start-cold' ? 'cold' : 'resume', null, log.by);
    return;
  }
  powering = true;
  closePowerMenu();
  let note;

    // Still starting: no shell has run, so nothing can have changed since the
    // files were put back.
    note = 'the machine had not finished starting, so there was nothing new to save';
  } else if (emulator && hostWorkspace) {
    status('saving your home directory…');
    // Bounded: a wedged guest must not make the power button the thing that hangs.
    const r = await Promise.race([
      saveWorkspace('power'),
      new Promise(res => setTimeout(() => res({ ok: false, text: 'the machine did not answer' }), 20000)),
    ]);

  } else {

    status('off', 'bad');
    $('power').classList.add('off');

function startAgain(boot, note, by) {

  window.name = JSON.stringify({ entityVm: { boot, note, by } });
  location.reload();
}
function closePowerMenu() {
  $('powermenu').hidden = true;

}
$('power').addEventListener('click', e => {
  e.stopPropagation();
  const menu = $('powermenu');
  if (!menu.hidden) { closePowerMenu(); return; }
  menu.style.top = Math.round($('bar').getBoundingClientRect().bottom + 2) + 'px';
  menu.hidden = false;

for (const b of document.querySelectorAll('#powermenu [data-power]')) {
  b.addEventListener('click', e => { e.stopPropagation(); power(b.dataset.power, 'menu'); });
}
document.addEventListener('click', e => { if (!$('powermenu').contains(e.target)) closePowerMenu(); });

// ── files, both directions ────────────────────────────────────────────────────
// Extraction asks the GUEST for the listing rather than reading emulator.fs9p:
// fs9p is an engine internal, so a listing built on it is a v86 driver wearing
// the contract's name.
async function putFiles(entries) {
  const out = [];
  for (const e of entries || []) {
    const bytes = (e.bytes instanceof Uint8Array) ? e.bytes : new Uint8Array(e.bytes);
    await emulator.create_file(e.name, bytes);

}
// ONE mechanism, not two: `x-list-files` is `runInGuest('ls -1 /mnt')`. The

// -- naming that is what stops the second copy of it being written.
// ⚠ `x-run` is THIS APP'S OWN BUSINESS and is deliberately NOT part of the verb
// pair we are asking entity-apps for. A host wanting files out of an app is
// general; a host running arbitrary commands inside one is a VM's affair, and
// putting it in a shared contract would be minting the widest possible verb on
// the strength of one consumer.
let seq = 0;
function runInGuest(cmd, ms) {
  return new Promise(resolve => {
    const tok = 'X' + (++seq) + 'Z';
    pending = { buf:'', tok, resolve };
    // The begin marker is only real when a NEWLINE follows it. The shell echoes
    // the whole command line back down the serial link, and that echo contains
    // both markers -- but there the begin marker is followed by `;`, so a match
    // that requires \r?\n cannot latch onto the echo of its own command.
    typeIn(`echo __B__${tok}; ${cmd}; echo __E__${tok}\n`);
    // A guest that never answers is "could not look", never "empty" -- different
    // facts, and only one of them means the VM produced nothing.
    setTimeout(() => {
      if (pending && pending.tok === tok) { const p = pending; pending = null; p.resolve(null); }
    }, ms || 4000);
  });
}
function feedRun(ch) {
  if (!pending) return;
  pending.buf += ch;
  const m = pending.buf.match(new RegExp('__B__' + pending.tok + '\\r?\\n([\\s\\S]*?)__E__' + pending.tok));
  if (!m) return;
  // busybox colourises `ls` even down a serial line; an unstripped name renders
  // fine and then makes read_file ask for a file that does not exist.
  const lines = m[1].split(/\r?\n/).map(s => strip(s).trim()).filter(s => s && !s.startsWith('__'));
  const p = pending; pending = null; p.resolve(lines);
}

addEventListener('message', async e => {
  const m = e.data;
  if (!m || m.source !== HOST) return;
  try {
    switch (m.type) {
      case 'init': {
        const offered = Array.isArray(m['x-assets']) ? m['x-assets'] : [];
        if (offered.includes('engine') && offered.includes('image')) hostBundles = new Set(offered);
        hostWorkspace = m['x-workspace'] === true;
        boot(); break;
      }
      case 'x-asset': onHostAsset(m); break;
      case 'x-work-listing': case 'x-work-file': case 'x-work-saved': onWorkReply(m); break;
      case 'request-state':
        // Whole-object, latest-wins, host-blind -- the contract's own semantics.
        // Deliberately NOT where file bytes go: debounced, retained N deep and
        // keyed by one app id, so a rootfs through here is resent in full on
        // every change and kept N times.
        send('state', { state: { booted, engine:'v86', arch:'i686', distro:'alpine-3.21',
          // the host cannot read into an opaque-origin document, so the only way
          // it learns whether xterm actually painted is for the app to say so.
          rows: term.rows, cols: term.cols,
          termPainted: document.querySelectorAll('.xterm-rows > div').length,
          promptMs: window.__m1.promptMs, fit: window.__m1.fit } });
        break;
      case 'x-put-files': send('x-files-put', { put: await putFiles(m.entries) }); break;
      case 'x-file': if (emulator) await receiveIn(m); break;
      case 'x-file-result':
        window.__m1.files = window.__m1.files || { sent: [], received: [], results: [] };
        window.__m1.files.results.push({ ok: !!m.ok, name: m.name, reason: m.reason || null });
        status(m.ok ? `the host saved ${m.name}` : `the host did not save ${m.name}: ${m.reason}`,
               m.ok ? 'ok' : 'bad');
        {
          const i = sendsWaiting.findIndex(s => s.name === m.name);
          if (i >= 0) {
            const [s] = sendsWaiting.splice(i, 1);
            // `detail` is the host's own sentence ("Saved notes.txt to your
            // files"); an older host sends none, so say what we know.
            const said = m.detail || (m.ok ? `the host kept ${m.name}` : `the host did not keep ${m.name}`);
            answerGuest(s.tok, !!m.ok, `send: ${said}${m.ok ? '' : ` (${m.reason})`}`);
          }
        }
        break;
      case 'x-list-files': {
        const names = await runInGuest('ls -1 /mnt');
        send('x-files-list', { names, couldNotLook: names === null }); break;
      }
      case 'x-run': {
        const out = await runInGuest(m.cmd, m.timeoutMs || 30000);
        send('x-run-done', { out, timedOut: out === null }); break;
      }
      case 'x-get-file': {
        const bytes = await emulator.read_file(m.name);
        // ⚠ NEVER transfer `bytes.buffer` directly: a Uint8Array can be a VIEW into
        // a larger backing buffer, so the receiver gets the view PLUS whatever else
        // is in there. Measured: a 33-byte file arrived as 49 bytes with 16 trailing
        // NULs, while four controlled probes were byte-exact -- data-dependent,
        // silent, and only on some files.
        const exact = (bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength)
          ? bytes : bytes.slice();
        // SAME SHAPE as `send`'s x-file ({name, media_type, data}): one message
        // name carrying two payload shapes is drift a host has to guess between.
        parent.postMessage({ source:APP, type:'x-file', name:m.name, media_type:'application/octet-stream',
                             length:exact.byteLength, data:exact.buffer }, '*', [exact.buffer]);
        break;
      }
      case 'destroy':
        try { emulator && emulator.destroy && emulator.destroy(); } catch (err) {}
        send('closed'); break;
    }
  } catch (err) { send('error', { message:String(err).slice(0,300) }); }
});

send('ready-for-init');
// The contract's 150ms fallback: a host that never answers still gets a working
// app. Standalone (no parent) that is the only path, and it is the common one.
// ⚠ EMBEDDED, THE FALLBACK WAITS LONGER: booting in URL mode inside a player
// fetches every file from the HOST's origin, where none of them exist, so a
// slow `init` would lose the host's assets to a boot that cannot succeed. A
// frame with a parent gets two seconds for `init` before falling back.
setTimeout(() => { if (!emulator) boot(); }, parent !== window ? 2000 : 150);
</script>
</body>
