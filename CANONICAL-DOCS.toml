# ═════════════════════════════════════════════════════════════════════════════
# What each directory IS
# ═════════════════════════════════════════════════════════════════════════════
# Added 2026-09-20. Nothing below changes what publishes. Every one of these
# directories was already internal, and had been since the day it was made — but
# it was internal BY SILENCE. The header of this file says dated handoffs, audits
# and reviews are "ephemeral and deliberately NOT listed", and the keep-list then
# proves it by not listing them. That works, and it is indistinguishable from
# having forgotten. A decision nobody can read is one somebody re-litigates.
#
# `publishes = false` does not withdraw anything and does not override the list
# above: a file declared [[doc]] still ships from a directory marked false. What
# it states is that the directory is a doc root whose UNDECLARED prose is this
# project's development history — the derivation, not the product — and is not
# addressed to a public reader.

[[area]]
path      = "docs/status"
kind      = "status"
publishes = false

# The finished-work archive. Dated by design and permanently kept: a handoff from
# 2026-07 is the record of that week and does not get truer or staler.
[[area]]
path      = "docs/archive"
kind      = "archive"
publishes = false

# Routing packets we have sent to other repos in this ecosystem. Addressed to a
# named recipient, never to a reader.
[[area]]
path      = "docs/outbox"
kind      = "outbox"
publishes = false

# The working design record — audits, punchlists, architecture notes, each written
# at a moment and about that moment. "status" rather than "archive" on purpose:
# this material ages out. A punchlist is overtaken, an audit is superseded, and the
# ones that stopped being true are still here because we do not delete them.
[[area]]
path      = "docs/plans"
kind      = "status"
publishes = false

# Design reviews, proposals and analyses. Mixed on purpose and the mix is the point:
# four documents in here are declared above and ship, because they describe what the
# thing IS. The rest are how we got there — the option we did not take, the review
# that found the defect, the proposal that was written before the shape was known.
# Dated where it is dated, and the date is provenance rather than filing, so these
# are kept rather than aged out.
[[area]]
path      = "docs/architecture/reviews"
kind      = "archive"
publishes = false

