[package]
name = "entity-browser-tauri"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "Entity Browser — Tauri desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
dirs = "6"

# Entity system — native peer for backend
# `sqlite` feature enables PeerBuilder::sqlite(path) so backend-peer
# trees persist across restarts (per GUIDE-PERSISTENCE.md §1).
entity-peer = { path = "../../entity-core-rust/core/peer", features = [
    "websocket", "inbox", "continuation", "subscription", "clock", "revision", "query",
    "sqlite", "history",
] }
entity-crypto = { path = "../../entity-core-rust/core/crypto" }
# Capability grant authoring — B self-seeds S's manager grant at designation
# (DESIGN-AUTHORIZE-GATE-INCREMENT-3 §3 Step 1).
entity-capability = { path = "../../entity-core-rust/core/capability" }
entity-ecf = { path = "../../entity-core-rust/core/ecf" }
entity-entity = { path = "../../entity-core-rust/core/entity" }
entity-types = { path = "../../entity-core-rust/core/types" }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Capture the backend peer's `tracing` output. entity-peer logs exclusively
# via `tracing` (handshake/dispatch/write/errors); without a subscriber in
# this process those events are dropped — the backend peer runs dark
# (DESIGN-SYSTEM-BACKEND-PEER §2).
#
# `default-features = false` deliberately DROPS the `tracing-log` feature: its
# `try_init` installs a global `log` logger (the log→tracing bridge), which
# then collides with `tauri-plugin-log` ("attempted to set a logger after the
# logging system was already initialized"). We don't need that bridge — the
# backend peer uses `tracing` directly — so tauri-plugin-log keeps sole
# ownership of the `log` crate (the webview console bridge).
# `registry` enables the layered subscriber + `reload` (runtime-adjustable log
# level for the System Backend window).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry"] }

[dev-dependencies]
tempfile = "3"
# manager_grant tests decode the authored policy body the way the kernel does.
ciborium = "0.2"
