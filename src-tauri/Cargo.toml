[package]
name = "entity-browser-tauri"
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
description = "Entity Browser — Tauri desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `net` + `time` are for `port_mapping.rs` (UDP to the gateway on 5351, and the
# retransmit/renewal timers). Both were already unified into the build by
# entity-peer's native deps; declared here because relying on another crate's
# feature selection is how a build breaks when that crate drops one.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
dirs = "6"
# PCP mapping nonces (RFC 6887 §11.2) — the one field an off-path attacker must
# not be able to predict. Already in the tree transitively (via `rand`), so this
# is a direct edge to a crate we ship either way, not a new supply-chain edge.
getrandom = "0.2"

# Entity system — native peer for backend
# `sqlite` feature enables PeerBuilder::sqlite(path) so backend-peer
# trees persist across restarts (per GUIDE-PERSISTENCE.md §1).
entity-peer = { path = "../../entity-core-rust/core/peer", features = [
    "websocket", "inbox", "continuation", "subscription", "clock", "revision", "query",
    "sqlite", "history",
    # EXTENSION-SIGNALING: lets this backend MOUNT `system/signaling` and be the
    # rendezvous itself (`signaling_node.rs`), not merely call one. A browser
    # peer has no listener, so two browsers need a third party holding the
    # bulletin board — and this process already binds a WebSocket a browser can
    # reach. Off unless the user turns it on; see `signaling_node::mount`.
    "signaling",
] }
entity-crypto = { path = "../../entity-core-rust/core/crypto" }
# The signaling extension as a DIRECT edge — `SignalingCore` / `SignalingHandler`
# / `signaling_seed_grants` / `Limits`, which are what mounting a node needs.
# `entity-peer/signaling` compiles the crate but re-exports none of it, the same
# reason the app crate takes this edge.
entity-signaling = { path = "../../entity-core-rust/extensions/signaling" }
# Capability grant authoring — B self-seeds S's manager grant at designation
# (DESIGN-AUTHORIZE-GATE-INCREMENT-3 §3 Step 1).
entity-capability = { path = "../../entity-core-rust/core/capability" }
entity-ecf = { path = "../../entity-core-rust/core/ecf" }
entity-entity = { path = "../../entity-core-rust/core/entity" }
entity-types = { path = "../../entity-core-rust/core/types" }
# `display` as well as `parse`: `persistence::set_signaling_node` rewrites
# config.toml from the parsed table rather than appending a line, so flipping a
# setting twice cannot leave two keys with the stale first one winning — and
# round-tripping the table is what preserves keys this version does not know.
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
# Capture the backend peer's `tracing` output. entity-peer logs exclusively
# via `tracing` (handshake/dispatch/write/errors); without a subscriber in
# this process those events are dropped — the backend peer runs dark
# (DESIGN-SYSTEM-BACKEND-PEER §2).
#
# `default-features = false` deliberately DROPS the `tracing-log` feature: its
# `try_init` installs a global `log` logger (the log→tracing bridge), which
# then collides with `tauri-plugin-log` ("attempted to set a logger after the
# logging system was already initialized"). We don't need that bridge — the
# backend peer uses `tracing` directly — so tauri-plugin-log keeps sole
# ownership of the `log` crate (the webview console bridge).
# `registry` enables the layered subscriber + `reload` (runtime-adjustable log
# level for the System Backend window).
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry"] }

[dev-dependencies]
tempfile = "3"
# manager_grant tests decode the authored policy body the way the kernel does.
ciborium = "0.2"
# access_log tests construct DispatchEvent fixtures (params_hash: Hash).
entity-hash = { path = "../../entity-core-rust/core/hash" }

# **The WebView's WebRTC switch, and it is not optional for this product.**
#
# WebKitGTK ships `WebKitSettings:enable-webrtc` DEFAULT FALSE — measured
# against the 2.50.6 in our image (`enable-webrtc = False`, while
# `enable-media-stream = True`) — and `wry` sets neither: zero hits for `webrtc`
# in `wry-0.55.1/src`. So `window.RTCPeerConnection` is UNDEFINED in the desktop
# WebView and every §6.5 establishment from Tori fails before it starts, while
# `meet` (an ordinary WebSocket call to the node) keeps working — which is what
# made this present as "they found each other but nothing connects".
#
# `lib.rs::enable_webview_webrtc` turns it on, and this crate is the only place
# that can: `tauri`'s `PlatformWebview::inner()` hands back exactly this crate's
# `WebView`, so the version must be the one `tauri-runtime-wry` resolves (2.0.x)
# or the types are two different `WebView`s. `v2_38` is the feature gating
# `set_enable_webrtc`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }
